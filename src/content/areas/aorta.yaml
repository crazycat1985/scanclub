views:
  - steps:
      - title: Set up
        text: "[Probe type, preset and depth to start with. Patient position.]"
        chips: ["Probe: [TBC]", "Preset: [TBC]"]
      - title: Find the landmark
        text: "[Where to place the probe first and which way the marker points. What to press or angle to get past bowel gas.]"
        chips: ["Marker: [TBC]", "Start: [TBC]"]
      - title: Sweep top to bottom
        text: "[How to slide down from just under the ribs to where the aorta splits, keeping it centred on screen.]"
        chips: ["Keep it centred", "Go slowly"]
