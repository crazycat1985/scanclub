# Abdominal aorta: the worked example.
# Probe steps and additions from POCUS 101 "Aorta Ultrasound Made Easy", reworded;
# reviewed by Shaked on 26 Sep 2026 (NUF-259). How to edit: see README.md.

status: ready
order: 1
name: Abdominal aorta
screensFor: AAA screening
viewCount: 2 views

views:
  - steps:
      - title: Set up
        text: Curved (curvilinear) probe, abdominal preset, starting depth 10–15 cm. Patient lying flat with knees bent to relax the tummy muscles. The machine goes on the patient's right.
        chips: ["Probe: curved", "Preset: abdomen, 10–15 cm"]
      - title: Find the landmark
        text: Probe across the body just below the tip of the breastbone, slightly left of the midline, with the marker pointing to the patient's right (9 o'clock). Adjust the depth until the bright spine and its black shadow sit at the bottom of the screen. Keep the probe upright. If bowel gas is in the way, press down steadily and rock the probe gently to push the gas aside. If that fails, roll the patient onto their left side.
        chips: ["Marker: patient's right", "Start: below the breastbone"]
      - title: Sweep top to bottom
        text: Slide down slowly, keeping the aorta in the middle of the screen the whole way. You'll pass the seagull (coeliac trunk), then the SMA just below it (a small round artery in front of the aorta), then the kidney arteries around the middle. Near the belly button the aorta is closest to the skin, so reduce the depth. Carry on past the belly button until it splits into the two iliac arteries.
        chips: ["Keep it centred", "Go slowly"]
      - title: Measure
        text: Freeze the image and measure outer wall to outer wall at the widest point, at the top, middle and bottom of the aorta. Measure front-to-back, and side-to-side too if you can. Then confirm lengthways. Go back to the top, centre the aorta, and turn the probe 90° clockwise so the marker points to the head. You should see the coeliac trunk and SMA branching off the front. Measure front-to-back with the callipers square to the wall.
        chips: ["Outer to outer", "Confirm lengthways"]

    image:
      image: /images/aorta/seagull-sign.webp
      still: /images/aorta/seagull-sign-still.jpg
      alt: Cross-section of the upper abdomen, coloured in turn to show the spine, aorta, IVC and the seagull-shaped coeliac trunk
      contributor: "Images: Dr Lindsay Davis, Dr Hannah Kopinski. Editing: Michael Amador, Dr Matthew Riscinti"
      link: https://www.thepocusatlas.com/aorta/yt9fab99cco1igugee7oarn8ckks9h

    landmarks:
      - title: Spine
        text: Bright curved line at the bottom with a black shadow beneath it. Find this first.
      - title: Aorta
        text: Round, thick bright wall, just in front of the spine on the patient's left (screen right). Pulsates.
      - title: IVC
        text: Flatter, thinner wall, on the patient's right. Squashes when you press and changes with breathing.
      - title: Seagull sign
        text: The coeliac trunk branching off the top of the aorta looks like a seagull's wings. Confirms you're high up.
        example:
          image: /images/aorta/seagull-sign.webp
          still: /images/aorta/seagull-sign-still.jpg
          alt: The coeliac trunk and its branches forming a seagull shape above the aorta
          contributor: "Images: Dr Lindsay Davis, Dr Hannah Kopinski. Editing: Michael Amador, Dr Matthew Riscinti"
          link: https://www.thepocusatlas.com/aorta/yt9fab99cco1igugee7oarn8ckks9h

    normal:
      - title: Round, under 3 cm
        text: Usually about 2 cm. A normal aorta stays roughly the same width all the way down, measured outer wall to outer wall.
        example:
          image: /images/aorta/upper-aorta.webp
          still: /images/aorta/upper-aorta-still.jpg
          alt: Normal upper aorta in cross-section, with the surrounding structures coloured in turn
          contributor: "Images: Dr Lindsay Davis, Dr Hannah Kopinski. Editing: Michael Amador, Dr Matthew Riscinti"
          link: https://www.thepocusatlas.com/aorta/mhpwcqnajfe5twvjrk8aay0cwqpqoh
      - title: Splits at the bottom
        text: Near the belly button it divides into the two iliac arteries. An iliac artery of 1.5 cm or more is an iliac aneurysm.
        example:
          image: /images/aorta/distal-aorta.webp
          still: /images/aorta/distal-aorta-still.jpg
          alt: Lower aorta dividing into the two iliac arteries, coloured in turn
          contributor: "Images: Dr Lindsay Davis, Dr Hannah Kopinski. Editing: Michael Amador, Dr Matthew Riscinti"
          link: https://www.thepocusatlas.com/aorta/8r9gnym19g5jaendduz5ofrka6emnf

    abnormal:
      - title: 3 cm or more
        text: Aneurysm (AAA), as is a section more than 50% wider than the section above it. Often has grey clot lining the wall, which can make the open channel look deceptively normal. Measure the outer wall, not the channel. An aneurysm can also bulge out on one side only (saccular), so look for pouches, not just widening.
        example:
          image: /images/aorta/aaa-sagittal.webp
          still: /images/aorta/aaa-sagittal-still.jpg
          alt: Long view of a large abdominal aortic aneurysm
          contributor: Robert Jones DO, FACEP
          link: https://www.thepocusatlas.com/aorta/sagittal-abdominal-aortic-aneurysm
      - title: A thin flap inside
        text: A moving line within the aorta suggests a dissection.
        example:
          image: /images/aorta/dissection-flap.webp
          still: /images/aorta/dissection-flap-still.jpg
          alt: Cross-section of the aorta with a faint moving flap inside it
          contributor: Robert Jones DO, FACEP
          link: https://www.thepocusatlas.com/aorta/dissection-flap
      - title: Fluid or a broken wall
        text: Blood around the aorta or a break in the wall suggests rupture, an emergency in a real patient.
        example:
          image: /images/aorta/ruptured-aaa.webp
          still: /images/aorta/ruptured-aaa-still.jpg
          alt: Long view of an aneurysm with bleeding in front of the aorta
          contributor: Robert Jones DO, FACEP
          link: https://www.thepocusatlas.com/aorta/ruptured-aaa-1

keyLearnings:
  - The spine is your anchor. The aorta sits just in front of it, on the patient's left.
  - "Aorta: round, thick wall, pulses, doesn't squash. IVC: flatter and squashes with pressure."
  - Normal is under 3 cm. 3 cm or more means an aneurysm.
  - Always sweep the full length. An aneurysm can be anywhere between the ribs and the split.
  - In the lengthways view, make sure you're cutting through the middle of the aorta. An off-centre slice makes it look narrower than it is.
  - A bedside aorta measurement is less accurate than a formal vascular scan.

selfCheck:
  - Find the spine first and use it as your anchor
  - Tell the aorta from the IVC
  - Spot the seagull sign (coeliac trunk)
  - Follow the aorta all the way down to where it splits
  - Measure outer wall to outer wall
