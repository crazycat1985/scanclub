# Lungs: three points on each side. Text from NUF-259, reviewed by Shaked on 26 Sep 2026.
# Sources: POCUS 101 "Lung Ultrasound Made Easy" and Rosen's Emergency Medicine ch. 63,
# both reworded. Clips: The POCUS Atlas.

status: ready
order: 3
name: Lungs
screensFor: Lung sliding, B-lines, effusion
viewCount: 3 views
comingSoonNote: holding its breath

views:
  - name: "Point 1: front"
    steps:
      - title: Set up
        text: "Probe: a curved (curvilinear) or phased-array probe is fine. Switch to the linear probe for a closer look at the surface of the lung; for a pneumothorax, the linear probe is best. Preset: lung or abdominal. Patient lying flat (sitting up also works). Raise the arm on the side you're scanning and put that hand behind the head. The machine goes on the patient's right."
        chips: ["Probe: curved or phased", "Preset: lung"]
        photo:
          image: /images/lungs/probe-setup.webp
          alt: "Patient lying flat with the arm raised and the hand behind the head"
          link: https://www.pocus101.com/lung-ultrasound-made-easy-step-by-step-guide/
      - title: "Point 1: front"
        text: Marker towards the head. Put the probe on the line down from the middle of the collarbone, in the 2nd rib space, and settle it between two ribs.
        chips: ["Marker: head", "2nd space, mid-collarbone"]
        photo:
          image: /images/lungs/probe-front.webp
          alt: "Probe at the 2nd rib space on the line down from the middle of the collarbone"
          link: https://www.pocus101.com/lung-ultrasound-made-easy-step-by-step-guide/
    image:
      image: /images/lungs/front.webp
      still: /images/lungs/front-still.jpg
      alt: Normal lung between two ribs, with the pleural line shimmering
      contributor: Dr Matthew Riscinti
      link: https://www.thepocusatlas.com/lung/2018/1/16/normal-lung-slide
    landmarks:
      - title: Bat sign
        text: Two rib shadows with the bright pleural line between them. It confirms you're sitting between two ribs.
      - title: Lung sliding
        text: The pleural line shimmers side to side as the patient breathes, like ants marching along a line.
    normal:
      - title: Lung sliding with A-lines
        text: Healthy, air-filled lung. If you can see sliding at a spot, there's no pneumothorax at that spot.
        example:
          image: /images/lungs/sliding.webp
          still: /images/lungs/sliding-still.jpg
          alt: Normal lung sliding with a regular pleural line
          contributor: Robert Jones DO, FACEP
          link: https://www.thepocusatlas.com/lung/normal-lung-sliding
      - title: B-lines also rule out a pneumothorax at that spot
        text: They come from the lung surface. This helps when sliding is hard to see.
    abnormal:
      - title: No lung sliding
        text: A pneumothorax is possible, but so are other things, such as severe consolidation, scarring or inflammation. Finding the "lung point", where sliding stops and starts, confirms a pneumothorax. On M-mode, sliding looks like a seashore and no sliding looks like a barcode.
        example:
          image: /images/lungs/point.webp
          still: /images/lungs/point-still.jpg
          alt: Lung point, where normal sliding meets a pneumothorax
          contributor: Breno Moura
          link: https://www.thepocusatlas.com/lung/lung-point-pneumothorax

  - name: "Point 2: side"
    steps:
      - title: "Point 2: side"
        text: Move to the middle of the armpit line, around the 6th to 7th rib space (just outside the nipple line in men). Settle it between two ribs again.
        chips: ["Mid-armpit line", "6th–7th space"]
        photo:
          image: /images/lungs/probe-side.webp
          alt: "Probe on the middle armpit line, around the 6th to 7th rib space"
          link: https://www.pocus101.com/lung-ultrasound-made-easy-step-by-step-guide/
    image:
      image: /images/lungs/a-lines.webp
      still: /images/lungs/a-lines-still.jpg
      alt: Normal lung with evenly spaced horizontal A-lines
      contributor: Hannah Kopinski, Dr Lindsay Davis, Dr Matthew Riscinti
      link: https://www.thepocusatlas.com/lung/5l9jgyaszu0othj5tidg0miqxkmvyv
    landmarks:
      - title: A-lines
        text: Faint horizontal copies of the pleural line, evenly spaced below it.
      - title: B-lines
        text: "Vertical: they start at the pleural line, move with the sliding, and reach the bottom of the screen."
    normal:
      - title: Fewer than 3 B-lines per view
        text: A single B-line can come from the gap between lobes.
        example:
          image: /images/lungs/a-lines.webp
          still: /images/lungs/a-lines-still.jpg
          alt: Normal lung with A-lines and no B-lines
          contributor: Hannah Kopinski, Dr Lindsay Davis, Dr Matthew Riscinti
          link: https://www.thepocusatlas.com/lung/5l9jgyaszu0othj5tidg0miqxkmvyv
    abnormal:
      - title: 3 or more B-lines per view, or B-lines merging into a white band
        text: Fluid in the lung. On both sides and even suggests heart failure (cardiogenic pulmonary oedema). On one side suggests pneumonia.
        example:
          image: /images/lungs/b-lines-oedema.webp
          still: /images/lungs/b-lines-oedema-still.jpg
          alt: Several vertical B-lines in one rib space, from pulmonary oedema
          contributor: Dr Justin Bowra et al. (Dr D Browne, Dr J Knights)
          link: https://www.thepocusatlas.com/lung/9kalmbf8y6j0nrspwvv876nyem83t5

  - name: "Point 3: low back (PLAPS)"
    steps:
      - title: "Point 3: low back (PLAPS)"
        text: Marker towards the head. Slide the probe under the patient where the back armpit line meets a rib space low down, between the 10th and 12th ribs.
        chips: ["PLAPS", "Back armpit line"]
        photo:
          image: /images/lungs/probe-back.webp
          alt: "Probe low on the back armpit line, between the 10th and 12th ribs"
          link: https://www.pocus101.com/lung-ultrasound-made-easy-step-by-step-guide/
      - title: Repeat on the other side
        text: Repeat all three points on the other side, so six points in total.
        chips: ["Both sides", "6 points"]
        photo:
          image: /images/lungs/probe-all-points.webp
          alt: "Diagram of all six lung points, three on each side"
          link: https://www.pocus101.com/lung-ultrasound-made-easy-step-by-step-guide/
    image:
      image: /images/lungs/curtain.webp
      still: /images/lungs/curtain-still.jpg
      alt: Normal lung sweeping down over the liver like a curtain on a deep breath
      contributor: Dr Gordon Johnson
      link: https://www.thepocusatlas.com/lung/0qbrvrw4ouvowjw3rqjd49q8ujia34
    landmarks:
      - title: Liver or spleen, kidney and diaphragm
        text: The liver on the right, the spleen on the left. On a breath in, the lung sweeps down over them like a curtain (curtain sign).
    normal:
      - title: The curtain sign is there, and the spine stops at the diaphragm
        text: A mirror image of the liver or spleen above the diaphragm is normal.
        example:
          image: /images/lungs/curtain.webp
          still: /images/lungs/curtain-still.jpg
          alt: Normal curtain sign at the low back point
          contributor: Dr Gordon Johnson
          link: https://www.thepocusatlas.com/lung/0qbrvrw4ouvowjw3rqjd49q8ujia34
    abnormal:
      - title: Dark fluid above the diaphragm, with the spine visible above it (spine sign)
        text: Pleural effusion, best seen at the low back point. Simple fluid is dark and even, and the squashed lung can often be seen floating in it. Strands, septations or swirling echoes suggest a complex effusion.
        example:
          image: /images/lungs/effusion.webp
          still: /images/lungs/effusion-still.jpg
          alt: Pleural effusion with squashed lung and the spine visible above the diaphragm
          contributor: Dimitri Livshits DO, Jane Belyavskaya MD, Chris Hanuscin MD
          link: https://www.thepocusatlas.com/lung/pleural-effusion-with-compressed-lung-and-spine-sign
      - title: Solid, liver-like lung with a ragged edge (shred sign) and moving bright specks of air
        text: Consolidation, as in pneumonia.
        example:
          image: /images/lungs/shred.webp
          still: /images/lungs/shred-still.jpg
          alt: Consolidated lung with a ragged, shredded lower edge
          contributor: Robert Jones DO, FACEP
          link: https://www.thepocusatlas.com/lung/pneumoniashred-sign

keyLearnings:
  - Find the bat sign first. Everything is read from the pleural line.
  - Sliding rules out a pneumothorax at that spot, but no sliding doesn't prove one.
  - "B-lines are vertical: they start at the pleural line, move with the sliding, and reach the bottom of the screen. A-lines are horizontal."
  - In a patient lying flat, air rises to the front of the chest, so check the front points for pneumothorax.
  - Fluid collects low down, so always check the low back point. Ultrasound picks up about 50 mL of pleural fluid; a chest X-ray needs about 200 mL.
  - In a pulmonary embolism the lungs often look normal. Check the heart and the leg veins instead.

selfCheck:
  - Find the bat sign between two ribs
  - See lung sliding (use M-mode if you're unsure)
  - Tell A-lines from B-lines
  - Find the diaphragm and the curtain sign at the low back point
  - Scan all six points
